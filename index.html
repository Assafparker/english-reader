<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קורא אנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,700&display=swap">
<style>
/* Layout: a single reading column like a study book; a bottom sheet holds every translation. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2633; --muted:#5d6b7c; --line:#d6dde5;
  --accent:#1f5f8b; --accent-ink:#ffffff; --mark:#fff0a3; --mark-ink:#1c2633;
  --hover:#e3edf6; --sent:#dfeee6; --shadow:0 -8px 30px rgba(20,35,55,.16);
  --f-ui:"Assistant","Segoe UI",Arial,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --read-size:1.25rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171e; --paper:#1a212b; --ink:#e4e9ef; --muted:#9aa8b8; --line:#2c3644;
  --accent:#6fb3e0; --accent-ink:#0d1a24; --mark:#5c5220; --mark-ink:#fff6cf;
  --hover:#243243; --sent:#1f3a2e; --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --paper:#1a212b; --ink:#e4e9ef; --muted:#9aa8b8; --line:#2c3644;
  --accent:#6fb3e0; --accent-ink:#0d1a24; --mark:#5c5220; --mark-ink:#fff6cf;
  --hover:#243243; --sent:#1f3a2e; --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-ui);
  padding:max(16px,env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:600}
button:hover{background:var(--hover)}
button:focus-visible,textarea:focus-visible,input:focus-visible,.w:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.icon{padding:8px 10px;min-width:42px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
textarea{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:12px;font:400 1.05rem/1.6 var(--f-read);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.hint{font-size:.9rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.hint b{color:var(--ink)}

#reader{direction:ltr;text-align:left;font:400 var(--read-size)/1.85 var(--f-read);
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#reader p{margin:0 0 1em}
#reader p:last-child{margin:0}
.s{border-radius:6px;transition:background .15s}
.s.on{background:var(--sent)}
.s.speaking{background:var(--sent);box-shadow:0 0 0 3px var(--sent)}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{background:var(--hover)}
.w.seen{text-decoration:underline dotted var(--muted);text-underline-offset:5px}
.w.saved{background:var(--mark);color:var(--mark-ink)}
.w.active{background:var(--accent);color:var(--accent-ink)}

.size{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}

/* bottom sheet */
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
#sheet .card{pointer-events:auto;width:min(760px,100%);background:var(--paper);border:1px solid var(--line);
  border-bottom:0;border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  padding:14px 18px calc(16px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto;
  transform:translateY(0);transition:transform .22s ease}
#sheet[hidden]{display:none!important}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.top{display:flex;align-items:center;gap:10px}
.src{direction:ltr;text-align:left;font:700 1.5rem/1.3 var(--f-read);flex:1;min-width:0;overflow-wrap:anywhere}
.src.sentence{font-size:1.1rem;font-weight:500;line-height:1.6}
.lbl{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.ctx{font-size:1.3rem;font-weight:700;line-height:1.4}
.ctx-exp{color:var(--muted);margin-top:2px}
.dict{display:flex;flex-direction:column;gap:4px}
.dict .pos{font-size:.8rem;color:var(--accent);font-weight:700;margin-inline-end:6px}
.he-sent{font-size:1.05rem;line-height:1.6}
.he-big{font-size:1.25rem;font-weight:600;line-height:1.6}
.wait{color:var(--muted);font-style:italic}
.err{color:#b4442c}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.close{margin-inline-start:auto}

/* saved words */
#saved .row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
#saved .row:first-child{border-top:0}
#saved .en{direction:ltr;font:700 1.05rem var(--f-read);min-width:0}
#saved .he{flex:1;min-width:0;color:var(--muted)}
#saved .row button{padding:4px 10px;font-size:.85rem}
.empty{color:var(--muted)}
.count{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px;font-size:.8rem;margin-inline-start:4px}
footer{color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>קורא <span>אנגלית</span></h1>
      <p class="sub">מדביקים טקסט, קוראים, ולוחצים על כל מילה שלא מכירים.</p>
    </div>
    <div class="toolbar">
      <button id="btnEdit" type="button">✎ טקסט חדש</button>
      <button id="btnSaved" type="button">המילים שלי<span class="count" id="savedCount">0</span></button>
    </div>
  </header>

  <section class="panel" id="editor" hidden>
    <textarea id="input" placeholder="Paste English text here…" aria-label="טקסט באנגלית"></textarea>
    <div class="toolbar" style="margin-top:10px">
      <button class="primary" id="btnRead" type="button">התחל לקרוא</button>
      <button id="btnCancel" type="button">ביטול</button>
    </div>
  </section>

  <div class="hint" id="hint">
    <span><b>לחיצה</b> על מילה – תרגום בהקשר</span>
    <span><b>לחיצה כפולה / לחיצה ארוכה</b> – תרגום המשפט</span>
  </div>

  <div class="toolbar">
    <button id="btnPlay" type="button">▶ הקרא הכול</button>
    <button id="btnSlow" type="button" aria-pressed="false">🐢 איטי</button>
    <span class="sp"></span>
    <div class="size">גודל
      <button class="icon" id="fsDown" type="button" aria-label="הקטן טקסט">A−</button>
      <button class="icon" id="fsUp" type="button" aria-label="הגדל טקסט">A+</button>
    </div>
  </div>

  <article id="reader" aria-live="polite"></article>

  <section class="panel" id="saved" hidden>
    <div class="toolbar" style="margin-bottom:6px">
      <strong style="font-size:1.1rem">המילים שלי</strong><span class="sp"></span>
      <button id="btnCopy" type="button">העתק רשימה</button>
      <button id="btnCloseSaved" type="button">סגור</button>
    </div>
    <div id="savedList"></div>
  </section>

  <footer>תרגום: Google Translate · הסבר בהקשר: מודל AI חינמי (Pollinations) · הקראה: קול הדפדפן</footer>
</div>

<div id="sheet" hidden><div class="card" role="dialog" aria-label="תרגום" id="card"></div></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SAMPLE = `The Boy Who Planted Trees

When Ari was twelve, his town looked tired. The old park had more dust than grass, and the river smelled bad in the summer. Most people complained, but nobody did anything.

One morning, Ari found a small oak seedling growing out of a crack in the sidewalk. He carried it home in a paper cup and planted it near the river. His friends laughed at him. "One tree won't change anything," they said.

Ari didn't argue. Every weekend he planted another tree, and he kept a notebook with the name and date of each one. After a year, he had forty trees. After three years, the birds came back, and a few neighbors started to help.

Today, the riverbank is green and shady. Children play there after school, and the water is clean enough for fish. When people ask Ari how he did it, he shrugs and says, "I just didn't wait for someone else to start."`;

/* ---------- state ---------- */
let text = store.get("rp_text", SAMPLE);
let saved = store.get("rp_saved", []);
let seen = new Set(store.get("rp_seen", []));
let fontSize = store.get("rp_fs", 1.25);
let slow = store.get("rp_slow", false);
const cache = new Map(Object.entries(store.get("rp_cache", {})));
let sentences = []; // {el, text}

/* ---------- tokenizing ---------- */
function splitSentences(p){
  if (window.Intl && Intl.Segmenter){
    try{ return [...new Intl.Segmenter("en",{granularity:"sentence"}).segment(p)].map(s=>s.segment); }catch(e){}
  }
  return p.match(/[^.!?]+(?:[.!?]+["'”’)\]]*\s*|$)/g) || [p];
}
const WORD = /[A-Za-z]+(?:['’][A-Za-z]+)*/g;

function render(){
  const reader = $("#reader");
  reader.innerHTML = "";
  sentences = [];
  const paras = text.replace(/\r/g,"").split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean);
  paras.forEach(p => {
    const pe = document.createElement("p");
    splitSentences(p).forEach(st => {
      if (!st.trim()){ pe.append(st); return; }
      const se = document.createElement("span");
      se.className = "s";
      se.dataset.i = sentences.length;
      sentences.push({el: se, text: st.trim()});
      let last = 0, m;
      WORD.lastIndex = 0;
      while ((m = WORD.exec(st))){
        if (m.index > last) se.append(st.slice(last, m.index));
        const w = document.createElement("span");
        w.className = "w";
        w.textContent = m[0];
        w.tabIndex = 0;
        decorate(w);
        se.append(w);
        last = m.index + m[0].length;
      }
      if (last < st.length) se.append(st.slice(last));
      pe.append(se);
    });
    reader.append(pe);
  });
}
const norm = w => w.toLowerCase().replace(/’/g,"'");
function decorate(w){
  const k = norm(w.textContent);
  w.classList.toggle("saved", saved.some(s => norm(s.w) === k));
  w.classList.toggle("seen", seen.has(k));
}
function redecorate(){ document.querySelectorAll(".w").forEach(decorate); }

/* ---------- translation services ---------- */
async function google(q){
  const key = "g:" + q;
  if (cache.has(key)) return cache.get(key);
  let out = null;
  try{
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&dt=bd&q=" + encodeURIComponent(q);
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const main = (j[0]||[]).map(x => x && x[0] || "").join("");
    const dict = (j[1]||[]).map(d => ({pos: d[0], terms: (d[1]||[]).slice(0,5)}));
    out = {main, dict};
  }catch(e){
    // fallback: MyMemory
    const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|he&q=" + encodeURIComponent(q));
    if (!r.ok) throw new Error("translate");
    const j = await r.json();
    out = {main: (j.responseData && j.responseData.translatedText) || "", dict: []};
  }
  remember(key, out);
  return out;
}

/* Free AI (Pollinations). Anonymous use is rate-limited (about one request per 15 s), so requests are queued. */
const AI_GAP = 16000;
let aiLast = 0, aiPending = null, aiTimer = null;
function aiContext(word, sentence, onState){
  const key = "ai:" + norm(word) + "|" + sentence;
  if (cache.has(key)){ onState({done: cache.get(key)}); return; }
  if (aiPending) aiPending.onState({cancelled:true});
  aiPending = {word, sentence, key, onState};
  clearTimeout(aiTimer);
  const wait = Math.max(0, aiLast + AI_GAP - Date.now());
  if (wait > 0){
    onState({queued: Math.ceil(wait/1000)});
    aiTimer = setTimeout(runAi, wait);
  } else runAi();
}
async function runAi(){
  const job = aiPending; if (!job) return;
  aiPending = null; aiLast = Date.now();
  job.onState({loading:true});
  const prompt =
`You help a Hebrew-speaking teenager read English.
Sentence: "${job.sentence}"
Word: "${job.word}"
Reply in Hebrew only, exactly two lines, no extra text:
line 1: the Hebrew translation of the word as it is used in THIS sentence (1-4 words)
line 2: a very short Hebrew explanation of its meaning here (max 15 words)`;
  try{
    const r = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt) + "?model=openai&referrer=english-reader");
    if (!r.ok) throw new Error(r.status);
    let t = (await r.text()).trim();
    const lines = t.split(/\n+/).map(s => s.replace(/^(line\s*\d\s*:|\d[.)]\s*|שורה\s*\d\s*:)/i,"").trim()).filter(Boolean);
    if (!lines.length) throw new Error("empty");
    const res = {tr: lines[0], exp: lines.slice(1).join(" ")};
    remember(job.key, res);
    job.onState({done: res});
  }catch(e){
    job.onState({failed:true});
  }
}
function remember(k, v){
  cache.set(k, v);
  if (cache.size > 600) cache.delete(cache.keys().next().value);
  store.set("rp_cache", Object.fromEntries(cache));
}

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  voice = vs.find(v => /en-US/i.test(v.lang) && /Google|Samantha|Natural|Aria|Jenny/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
const hasTTS = "speechSynthesis" in window;
if (hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let reading = false;
function speak(t, opts = {}){
  if (!hasTTS) return;
  if (!opts.keep) stopReading();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; if (voice) u.voice = voice;
  u.rate = (opts.slow ?? slow) ? 0.7 : 0.95;
  if (opts.onend) u.onend = opts.onend;
  speechSynthesis.speak(u);
}
function stopReading(){
  if (!reading) return;
  reading = false;
  document.querySelectorAll(".s.speaking").forEach(e => e.classList.remove("speaking"));
  $("#btnPlay").textContent = "▶ הקרא הכול";
}
function readAll(from = 0){
  if (!hasTTS) return;
  if (reading){ stopReading(); speechSynthesis.cancel(); return; }
  reading = true;
  $("#btnPlay").textContent = "■ עצור";
  const step = i => {
    document.querySelectorAll(".s.speaking").forEach(e => e.classList.remove("speaking"));
    if (!reading || i >= sentences.length){ stopReading(); return; }
    const s = sentences[i];
    s.el.classList.add("speaking");
    s.el.scrollIntoView({block:"center", behavior:"smooth"});
    speak(s.text, {keep:true, onend: () => reading && step(i + 1)});
  };
  step(from);
}

/* ---------- sheet ---------- */
const sheet = $("#sheet"), card = $("#card");
let activeWord = null, activeSent = null, sheetToken = 0;
function clearActive(){
  if (activeWord) activeWord.classList.remove("active");
  if (activeSent) activeSent.classList.remove("on");
  activeWord = activeSent = null;
}
function closeSheet(){ sheet.hidden = true; clearActive(); sheetToken++; }

function openWord(wEl){
  clearActive();
  const sEl = wEl.closest(".s");
  const word = wEl.textContent;
  const sentence = sentences[+sEl.dataset.i].text;
  activeWord = wEl; wEl.classList.add("active");
  const k = norm(word);
  if (!seen.has(k)){ seen.add(k); store.set("rp_seen", [...seen].slice(-2000)); }
  decorate(wEl); wEl.classList.add("active");
  const isSaved = saved.some(s => norm(s.w) === k);
  const tok = ++sheetToken;
  card.innerHTML = `
    <div class="grip"></div>
    <div class="top">
      <div class="src">${esc(word)}</div>
      <button class="icon" data-act="sayw" type="button" aria-label="השמע מילה">🔊</button>
      <button class="icon" data-act="sayws" type="button" aria-label="השמע לאט">🐢</button>
    </div>
    <div class="lbl">בהקשר של המשפט</div>
    <div id="ctxBox"><div class="wait">חושב…</div></div>
    <div class="lbl">תרגום מילוני</div>
    <div id="dictBox"><div class="wait">מתרגם…</div></div>
    <div class="lbl">המשפט כולו</div>
    <div class="he-sent" id="sentBox"><span class="wait">מתרגם…</span></div>
    <div class="actions">
      <button class="primary" data-act="save" type="button">${isSaved ? "✓ שמורה" : "☆ שמור מילה"}</button>
      <button data-act="says" type="button">🔊 השמע משפט</button>
      <button data-act="close" class="close" type="button">סגור</button>
    </div>`;
  card.dataset.word = word; card.dataset.sentence = sentence;
  sheet.hidden = false;
  card.scrollTop = 0;

  google(word).then(r => {
    if (tok !== sheetToken) return;
    card.dataset.tr = r.main;
    const dict = r.dict.length
      ? r.dict.map(d => `<div><span class="pos">${esc(posHe(d.pos))}</span>${esc(d.terms.join(", "))}</div>`).join("")
      : `<div>${esc(r.main)}</div>`;
    $("#dictBox").innerHTML = `<div class="dict">${dict}</div>`;
  }).catch(() => { if (tok === sheetToken) $("#dictBox").innerHTML = `<div class="err">אין חיבור לשירות התרגום. נסו שוב.</div>`; });

  google(sentence).then(r => {
    if (tok !== sheetToken) return;
    $("#sentBox").textContent = r.main;
    if (!$("#ctxBox .ctx")) card.dataset.sentTr = r.main;
  }).catch(() => { if (tok === sheetToken) $("#sentBox").innerHTML = `<span class="err">לא הצלחתי לתרגם את המשפט.</span>`; });

  aiContext(word, sentence, st => {
    if (tok !== sheetToken || st.cancelled) return;
    const box = $("#ctxBox"); if (!box) return;
    if (st.queued) box.innerHTML = `<div class="wait">ההסבר יגיע בעוד ${st.queued} שניות (המודל החינמי מוגבל לבקשה אחת בכל כמה שניות)…</div>`;
    else if (st.loading) box.innerHTML = `<div class="wait">חושב על המשמעות במשפט הזה…</div>`;
    else if (st.done){
      card.dataset.ctx = st.done.tr;
      box.innerHTML = `<div class="ctx">${esc(st.done.tr)}</div>${st.done.exp ? `<div class="ctx-exp">${esc(st.done.exp)}</div>` : ""}`;
    }
    else if (st.failed) box.innerHTML = `<div class="wait">ההסבר בהקשר לא זמין כרגע. התרגום המילוני ותרגום המשפט למטה יעזרו להבין.</div>`;
  });
}

function openSentence(sEl){
  clearActive();
  activeSent = sEl; sEl.classList.add("on");
  const sentence = sentences[+sEl.dataset.i].text;
  const tok = ++sheetToken;
  card.innerHTML = `
    <div class="grip"></div>
    <div class="top">
      <div class="src sentence">${esc(sentence)}</div>
    </div>
    <div class="lbl">תרגום</div>
    <div class="he-big" id="sentBox"><span class="wait">מתרגם…</span></div>
    <div class="actions">
      <button class="primary" data-act="says" type="button">🔊 השמע</button>
      <button data-act="sayss" type="button">🐢 השמע לאט</button>
      <button data-act="readfrom" type="button">▶ הקרא מכאן</button>
      <button data-act="close" class="close" type="button">סגור</button>
    </div>`;
  card.dataset.sentence = sentence; card.dataset.idx = sEl.dataset.i;
  sheet.hidden = false; card.scrollTop = 0;
  google(sentence).then(r => { if (tok === sheetToken) $("#sentBox").textContent = r.main; })
    .catch(() => { if (tok === sheetToken) $("#sentBox").innerHTML = `<span class="err">אין חיבור לשירות התרגום. נסו שוב.</span>`; });
}
function posHe(p){
  return ({noun:"שם עצם",verb:"פועל",adjective:"תואר",adverb:"תואר הפועל",preposition:"מילת יחס",pronoun:"כינוי",conjunction:"מילת חיבור",interjection:"מילת קריאה",abbreviation:"קיצור",article:"תווית"})[p] || p;
}

card.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const a = b.dataset.act, d = card.dataset;
  if (a === "close") closeSheet();
  else if (a === "sayw") speak(d.word, {slow:false});
  else if (a === "sayws") speak(d.word, {slow:true});
  else if (a === "says") speak(d.sentence);
  else if (a === "sayss") speak(d.sentence, {slow:true});
  else if (a === "readfrom"){ const i = +d.idx; closeSheet(); stopReading(); readAll(i); }
  else if (a === "save"){
    const k = norm(d.word);
    const i = saved.findIndex(s => norm(s.w) === k);
    if (i >= 0){ saved.splice(i,1); b.textContent = "☆ שמור מילה"; }
    else { saved.unshift({w:d.word, tr: d.ctx || d.tr || "", s: d.sentence, t: Date.now()}); b.textContent = "✓ שמורה"; }
    store.set("rp_saved", saved); redecorate(); if (activeWord) activeWord.classList.add("active"); renderSaved();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- tap / double-tap / long-press ---------- */
const reader = $("#reader");
let tapTimer = null, lastTap = {t:0, s:null}, pressTimer = null, longFired = false, downPos = null;
reader.addEventListener("pointerdown", e => {
  const s = e.target.closest(".s"); if (!s) return;
  longFired = false; downPos = {x:e.clientX, y:e.clientY};
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { longFired = true; clearTimeout(tapTimer); openSentence(s); if (navigator.vibrate) navigator.vibrate(15); }, 480);
});
reader.addEventListener("pointermove", e => {
  if (downPos && Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) > 10) clearTimeout(pressTimer);
});
reader.addEventListener("pointercancel", () => clearTimeout(pressTimer));
reader.addEventListener("pointerup", e => {
  clearTimeout(pressTimer);
  if (longFired) { longFired = false; return; }
  if (downPos && Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) > 10) return;
  const s = e.target.closest(".s"); if (!s) return;
  const w = e.target.closest(".w");
  const now = Date.now();
  if (now - lastTap.t < 300 && lastTap.s === s){
    clearTimeout(tapTimer); lastTap = {t:0, s:null}; openSentence(s); return;
  }
  lastTap = {t:now, s};
  clearTimeout(tapTimer);
  if (w) tapTimer = setTimeout(() => openWord(w), 260);
});
reader.addEventListener("contextmenu", e => e.preventDefault());
reader.addEventListener("keydown", e => {
  const w = e.target.closest(".w"); if (!w) return;
  if (e.key === "Enter") { e.preventDefault(); e.shiftKey ? openSentence(w.closest(".s")) : openWord(w); }
});

/* ---------- saved list ---------- */
function renderSaved(){
  $("#savedCount").textContent = saved.length;
  const list = $("#savedList");
  if (!saved.length){ list.innerHTML = `<p class="empty">עוד לא נשמרו מילים. לחצו על מילה ואז על "שמור מילה".</p>`; return; }
  list.innerHTML = saved.map((s,i) => `<div class="row">
      <span class="en">${esc(s.w)}</span><span class="he">${esc(s.tr)}</span>
      <button type="button" data-say="${i}" aria-label="השמע">🔊</button>
      <button type="button" data-del="${i}">הסר</button></div>`).join("");
}
$("#savedList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.say) speak(saved[+b.dataset.say].w);
  if (b.dataset.del){ saved.splice(+b.dataset.del,1); store.set("rp_saved", saved); renderSaved(); redecorate(); }
});
$("#btnSaved").onclick = () => { const p = $("#saved"); p.hidden = !p.hidden; if (!p.hidden) p.scrollIntoView({behavior:"smooth"}); };
$("#btnCloseSaved").onclick = () => $("#saved").hidden = true;
$("#btnCopy").onclick = async e => {
  const t = saved.map(s => `${s.w} – ${s.tr}`).join("\n");
  try{ await navigator.clipboard.writeText(t); e.target.textContent = "הועתק ✓"; }
  catch(err){ e.target.textContent = "לא הצלחתי להעתיק"; }
  setTimeout(() => e.target.textContent = "העתק רשימה", 1800);
};

/* ---------- editor & controls ---------- */
$("#btnEdit").onclick = () => { $("#input").value = text === SAMPLE ? "" : text; $("#editor").hidden = false; $("#input").focus(); };
$("#btnCancel").onclick = () => $("#editor").hidden = true;
$("#btnRead").onclick = () => {
  const v = $("#input").value.trim();
  if (!v) { $("#input").focus(); return; }
  text = v; store.set("rp_text", text); $("#editor").hidden = true; closeSheet(); stopReading(); render(); window.scrollTo({top:0, behavior:"smooth"});
};
function applyFs(){ document.documentElement.style.setProperty("--read-size", fontSize + "rem"); store.set("rp_fs", fontSize); }
$("#fsUp").onclick = () => { fontSize = Math.min(2.2, +(fontSize + .1).toFixed(2)); applyFs(); };
$("#fsDown").onclick = () => { fontSize = Math.max(.9, +(fontSize - .1).toFixed(2)); applyFs(); };
function applySlow(){ const b = $("#btnSlow"); b.setAttribute("aria-pressed", slow); b.classList.toggle("primary", slow); store.set("rp_slow", slow); }
$("#btnSlow").onclick = () => { slow = !slow; applySlow(); };
$("#btnPlay").onclick = () => { closeSheet(); readAll(0); };
if (!hasTTS){ $("#btnPlay").disabled = true; $("#btnSlow").disabled = true; }

applyFs(); applySlow(); render(); renderSaved();
})();
</script>
